
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Generator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1d2671, #c33764);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: #7b2ff7;
    }

    button {
      background: #7b2ff7;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5f1cd8;
    }

    .image-box {
      margin-top: 30px;
      width: 100%;
      min-height: 300px;
      border: 2px dashed #ccc;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f9f9f9;
      position: relative;
    }

    .image-box img {
      width: 100%;
      display: none;
      border-radius: 10px;
    }

    .loader {
      display: none;
      width: 50px;
      height: 50px;
      border: 5px solid #ddd;
      border-top: 5px solid #7b2ff7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .download-btn {
      margin-top: 20px;
      display: none;
      background: #28a745;
    }

    .download-btn:hover {
      background: #1e7e34;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI Image Generator</h1>
    <p>Apna prompt likho aur AI image generate karo</p>

    <input type="text" id="prompt" placeholder="Example: Futuristic city at night" />

    <button id="generateBtn">Generate Image</button>

    <div class="image-box">
      <div class="loader" id="loader"></div>
      <img id="generatedImage" src="" alt="Generated Image" />
    </div>

    <button class="download-btn" id="downloadBtn">Download Image</button>
  </div>

  <script>
    const generateBtn = document.getElementById("generateBtn");
    const promptInput = document.getElementById("prompt");
    const generatedImage = document.getElementById("generatedImage");
    const loader = document.getElementById("loader");
    const downloadBtn = document.getElementById("downloadBtn");

    generateBtn.addEventListener("click", async () => {
      const prompt = promptInput.value.trim();

      if (!prompt) {
        alert("Please enter a prompt!");
        return;
      }

      generatedImage.style.display = "none";
      downloadBtn.style.display = "none";
      loader.style.display = "block";

      try {
        // Free AI Image API
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`;

        // Wait for image load
        generatedImage.onload = () => {
          loader.style.display = "none";
          generatedImage.style.display = "block";
          downloadBtn.style.display = "inline-block";
        };

        generatedImage.src = imageUrl;

      } catch (error) {
        loader.style.display = "none";
        alert("Error generating image!");
      }
    });

    downloadBtn.addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = generatedImage.src;
      link.download = "ai-image.jpg";
      link.click();
    });
  </script>

</body>
</html>
